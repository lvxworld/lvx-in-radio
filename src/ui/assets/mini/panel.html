<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'">
  <title>LVX mini player</title>
  <link rel="stylesheet" href="panel.css">
  <script src="panel-bridge.js"></script>
  <script src="panel.js" defer></script>
  <script type="module" src="panel-aura.js"></script>
</head>
<body>
  <main class="mini-radio">
    <canvas id="aura" aria-hidden="true"></canvas>
    <header>
      <span class="brand"><img src="../logo-symbol.png" alt=""><span>LVX<small>IN RADIO</small></span></span>
      <div class="header-actions"><span class="status" role="status"><i></i><span id="status">READY</span></span><button id="tray" type="button" aria-label="Move to menu bar" title="Keep listening in the menu bar" hidden><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5h14M12 19V9m-4 4 4-4 4 4"></path></svg></button></div>
    </header>
    <section class="station" aria-label="Current station">
      <div class="station-dial"><canvas id="dial" aria-hidden="true"></canvas><div class="frequency"><span id="frequency">—</span><small>FM</small></div></div>
      <h1 id="station">LVX in Radio</h1>
      <p id="track">Your radio, a little closer.</p>
    </section>
    <div class="transport">
      <button id="play" type="button" aria-label="Play" title="Play" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-glyph" d="M9 5v14l11-7z"></path></svg>
      </button>
      <div><strong id="play-label">Play</strong><span id="play-hint">Choose a station in the app</span></div>
      <svg class="signal" viewBox="0 0 50 30" fill="none" aria-hidden="true"><path d="M1 15h8l5-9 10 19 7-19 6 9h12"></path></svg>
    </div>
    <button id="open" type="button">Open radio<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 9h18"></path></svg></button>
  </main>
</body>
</html>
